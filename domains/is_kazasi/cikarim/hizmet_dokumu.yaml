# S.G.K Uzun Vade Hizmet Dökümü (kurum sistemi -> *_HizmetDokumuUV.pdf)
# Raporun 4.3 (prime esas kazançlar) tablosunu ve Faz 4'ün çalışma süresi
# kontrollerini besler. Sabit genişlikli kurum tablosu: kolon çapaları
# ölçülüp yazıldı, her sayfada başlık satırıyla doğrulanıyor.
belge_turu: hizmet_dokumu
motor: tablo

tanima:
  metin_icerir:
    - "Hizmet Dökümü"

